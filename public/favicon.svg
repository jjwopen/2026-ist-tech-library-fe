  <rect x=".5" y=".5" width="47" height="47" rx="10.5" fill="none" stroke="#1F1D1A" stroke-opacity=".12"/>
  <!-- P: 찾은 책의 책등(기둥)과, 그 자리를 알리는 파문(호·고리)과 인주 점 -->
