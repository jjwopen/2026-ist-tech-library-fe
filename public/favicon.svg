    <g fill="#1F1D1A" stroke="none">
      <rect x="17.4" y="8.5" width="6.6" height="3.9" rx=".5"/>
      <rect x="17.4" y="13.3" width="6.6" height="22.1"/>
      <rect x="17.4" y="36.3" width="6.6" height="4.2" rx=".5"/>
    </g>
    <path stroke-width="1.6" stroke-linecap="round" d="M24 11.3A9.5 9.5 0 1 1 24 26.3"/>
    <circle stroke-width="1.25" cx="29.8" cy="18.8" r="5"/>
    <circle fill="#A93A2A" stroke="none" cx="29.8" cy="18.8" r="1.9"/>
  </g>
</svg>
